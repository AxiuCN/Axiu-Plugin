# Axiu-Plugin 配置文件

api:
  #使用的平台，0：test_nine；1：ttocr.com；2：2captcha.com
  type: ${api_type}
  #使用的api(test_nine、ttocr、2captcha必填)，例：https://api.example.com/recognize
  api: ${api_api}
  #使用的resapi(ttocr、2captcha必填)，例：https://api.example.com/results
  resapi: ${api_resapi}
  #api、resapi需要的key(ttocr、2captcha必填)，例: appkey=***
  key: ${api_key}
  #api需要的其他参数(除"key、gt、challenge"以外的，ttocr、2captcha必填)，例: referer=***
  query: ${api_query}
  #resapi需要的其他参数(除"key"以外的，2captcha必填)，例: action=***
  resquery: ${api_resquery}

  # 是否启动内置打码服务（关闭后可用他人服务或不使用手动打码）
  startApi: ${api_startApi}
  # 内置打码服务监听端口
  Port: ${api_Port}
  # 监听地址，本地部署 127.0.0.1，需反向代理时改 0.0.0.0
  bindHost: ${api_bindHost}
  # 发送给用户的打码链接前缀，必须是用户设备能访问到的地址
  Address: ${api_Address}
  # Bot 提交验证码的地址，用自己的服务保持默认即可，用他人的按对方提供填写
  verifyAddr: ${api_verifyAddr}

  # 0:仅手动；1:仅自动；2:自动失败换手动
  GtestType: ${api_GtestType}

  # 是否启用扫码登录功能（仅master可用）
  qrLogin_enabled: ${api_qrLogin_enabled}

# 米游社签到
signin:
  # 是否启用自动签到
  enable: ${signin_enable}
  # 签到时间 cron 表达式（Quartz格式），默认每天5:00
  schedule: ${signin_schedule}
  # 自动刷新 cookie 的 cron 表达式，默认每天4:30
  refreshSchedule: ${signin_refreshSchedule}
  # 随机延迟上限（分钟），0=不延迟
  randomDelayMin: ${signin_randomDelayMin}
  # Python 命令
  pythonCommand: ${signin_pythonCommand}
  # 自动签到完成后在群内通知
  notifyGroup: ${signin_notifyGroup}
  # 签到报告发送的目标群号，逗号分隔，为空则仅通知 master
  reportGroups: ${signin_reportGroups}
  # 过码最大重试次数
  captchaRetries: ${signin_captchaRetries}
  # 过码超时（秒）
  captchaTimeout: ${signin_captchaTimeout}

# 原神深渊查询
gsAbyss:
  # 是否启用深渊查询（关闭后 #深渊/#剧诗/#幽境 等命令不响应）
  enabled: ${gsAbyss_enabled}

# 原神深渊排行
gsAbyssRank:
  # 是否启用深渊排行（关闭后不上报、不响应排行命令）
  enabled: ${gsAbyssRank_enabled}
  # 排行上榜人数上限（5-50）
  rankNumber: ${gsAbyssRank_rankNumber}

# 星铁终局挑战查询
srChallenge:
  # 是否启用终局挑战查询（关闭后 *末日/*虚构/*混沌 等命令不响应）
  enabled: ${srChallenge_enabled}

# 星铁终局挑战排行
srChallengeRank:
  # 是否启用挑战排行（关闭后不上报、不响应排行命令）
  enabled: ${srChallengeRank_enabled}
  # 排行上榜人数上限（5-50）
  rankNumber: ${srChallengeRank_rankNumber}

# 代发言
proxySpeak:
  # 是否启用代发言功能（关闭后 #代 命令不响应）
  enabled: ${proxySpeak_enabled}
