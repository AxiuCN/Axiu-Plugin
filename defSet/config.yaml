# Axiu-Plugin 重启管理配置

restart:
  # 是否启用 MCSM 面板重启（关闭则使用框架原生重启）
  enableMcsm: ${restart_enableMcsm}

  # 是否从 mcsmanager-plugin 的用户数据自动读取 API Key 与面板地址
  # 开启后，下方 mcsmHost / mcsmPort / mcsmApiKey 将被忽略
  useMcsmManagerPluginConfig: ${restart_useMcsmManagerPluginConfig}

  # MCSManager 面板地址（仅在 useMcsmManagerPluginConfig: false 时需要填写）
  mcsmHost: ${restart_mcsmHost}
  mcsmPort: ${restart_mcsmPort}
  mcsmApiKey: ${restart_mcsmApiKey}

  # 实例 UUID 与守护进程 ID（必填，需手动指定）
  mcsmInstanceUuid: ${restart_mcsmInstanceUuid}
  mcsmDaemonId: ${restart_mcsmDaemonId}

  # 定时重启 cron 表达式（可选，支持多个）
  restartCron: ${restart_restartCron}
